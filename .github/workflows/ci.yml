name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "24"
  FRONTEND_URL: "https://github.com/KnightBlood/neoskin-frontend/releases/download/legacy-assets-v6.0.10_patch/blessing-skin-server_6.0.10_patch_php85.zip"
  FRONTEND_SHA256: "bb94f83718f3fca3737a04b2097e747720ebd5966979cf042dbbba5434da3e73"

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  platform:
    name: Platform (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-latest, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go test ./... -count=1

  race-coverage:
    name: Race detector & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Race detector + coverage
        run: go test ./... -count=1 -race -covermode=atomic -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  browser-e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install browser test deps
        run: npm ci --prefix tests/browser
      - name: Fetch legacy frontend assets
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/bs.zip --retry 5 --retry-delay 10 --retry-all-errors "$FRONTEND_URL"
          echo "$FRONTEND_SHA256  /tmp/bs.zip" | sha256sum -c -
          unzip -q /tmp/bs.zip -d /tmp/bs
          mkdir -p public
          rm -rf public/app
          cp -r /tmp/bs/public/app public/app
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Export Chrome path
        run: echo "NEOSKIN_CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Browser E2E
        env:
          NEOSKIN_BROWSER_E2E: "1"
        run: go test ./tests/browser -count=1 -v

  db-matrix:
    name: DB matrix (${{ matrix.db }})
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            image: mysql:8.4
            port: 3306
            username: root
            password: root
            health: "mysqladmin ping -h localhost -uroot -proot"
          - db: mariadb
            image: mariadb:11.8
            port: 3306
            username: root
            password: root
            health: "healthcheck.sh --connect --innodb_initialized"
          - db: pgsql
            image: postgres:18
            port: 5432
            username: postgres
            password: root
            health: "pg_isready -U postgres"
          - db: sqlsrv
            image: mcr.microsoft.com/mssql/server:2025-latest
            port: 1433
            username: sa
            password: "YourStrong!Passw0rd"
            health: "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P YourStrong!Passw0rd -Q 'SELECT 1'"
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blessingskin
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: blessingskin
          POSTGRES_PASSWORD: root
          POSTGRES_DB: blessingskin
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: blessingskin
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      APP_KEY: "0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Create SQL Server database
        if: matrix.db == 'sqlsrv'
        run: >-
          docker exec ${{ job.services.database.id }}
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
          -P "${{ matrix.password }}" -Q "CREATE DATABASE blessingskin"
      - run: go test ./internal/db -run TestMatrix -v -count=1
      - run: go test ./internal/repo -run TestRepositoriesMatrix -v -count=1
