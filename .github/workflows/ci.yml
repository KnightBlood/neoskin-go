name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  race-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Race detector + coverage
        run: go test ./... -count=1 -race -covermode=atomic -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  browser-e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test deps
        run: npm ci --prefix tests/browser
      - name: Fetch legacy frontend assets
        run: |
          set -euo pipefail
          curl -sSLo /tmp/bs.zip \
            "https://github.com/DreamCraft-Tech/blessing-skin-server-patch/releases/download/v6.0.10_patch/blessing-skin-server_6.0.10_patch_php85.zip"
          echo "bb94f83718f3fca3737a04b2097e747720ebd5966979cf042dbbba5434da3e73  /tmp/bs.zip" | sha256sum -c -
          unzip -q /tmp/bs.zip -d /tmp/bs
          mkdir -p public
          rm -rf public/app
          cp -r /tmp/bs/public/app public/app
      - name: Locate Chrome
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "NEOSKIN_CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          fi
      - name: Browser E2E
        env:
          NEOSKIN_BROWSER_E2E: "1"
        run: go test ./tests/browser -count=1 -v

  db-matrix:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            image: mysql:8.0
            port: 3306
            username: root
            password: root
            health: "mysqladmin ping -h localhost -uroot -proot"
          - db: mariadb
            image: mariadb:11.4
            port: 3306
            username: root
            password: root
            health: "healthcheck.sh --connect --innodb_initialized"
          - db: pgsql
            image: postgres:16
            port: 5432
            username: postgres
            password: root
            health: "pg_isready -U postgres"
          - db: sqlsrv
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            username: sa
            password: "YourStrong!Passw0rd"
            health: "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P YourStrong!Passw0rd -Q 'SELECT 1'"
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blessingskin
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: blessingskin
          POSTGRES_PASSWORD: root
          POSTGRES_DB: blessingskin
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: blessingskin
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      APP_KEY: "0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Create SQL Server database
        if: matrix.db == 'sqlsrv'
        run: >-
          docker exec ${{ job.services.database.id }}
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
          -P "${{ matrix.password }}" -Q "CREATE DATABASE blessingskin"
      - run: go test ./internal/db -run TestMatrix -v -count=1
      - run: go test ./internal/repo -run TestRepositoriesMatrix -v -count=1
